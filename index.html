function toast(msg,error=false){const e=$('#toast');e.textContent=msg;e.classList.toggle('error',error);e.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.hidden=true,5000);}
async function call(action,data={}){if(!GAS)throw Error('Aksi live hanya tersedia di ruang kerja Apps Script.');return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>r&&r.error?reject(Error(r.error)):resolve(r)).withFailureHandler(e=>reject(Error(e.message||e))).api(action,data,token));}
async function mutate(task){if(busy)return;busy=true;document.body.classList.add('busy');try{await task();lastSync=new Date().toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta'});render();}catch(e){toast(e.message,true);}finally{busy=false;document.body.classList.remove('busy');}}
function status(p,n){return typeof p.stages?.[n]==='object'?p.stages[n].status:p.stage?.[n]||'draft';}
function done(p){return stages.filter((_,n)=>status(p,n)==='approved').length;}
function pending(p){return stages.map((_,i)=>i).filter(i=>status(p,i)==='submitted');}
function activeStep(p){const n=stages.findIndex((_,i)=>status(p,i)!=='approved');return n<0?7:n;}
function badge(s){return `<span class="pill ${s==='approved'?'lime':s==='submitted'?'orange':s==='revision'?'purple':''}">${statusNames[s]||esc(s)}</span>`;}
function shown(){return projects.filter(p=>(filter==='all'||p.class===filter)&&(!query||(p.title+' '+p.id+' '+p.region).toLowerCase().includes(query.toLowerCase())));}
function project(){return projects.find(p=>p.id===selected)||projects[0];}
function choose(id,n){selected=id;if(n!==undefined)currentStep=Number(n);else currentStep=activeStep(projects.find(p=>p.id===id));go('workspace');}

function title(eye,head,desc,action=''){return `<section class="intro"><div><div class="eyebrow">${eye}</div><h1>${head}</h1><p>${desc}</p></div>${action}</section>`;}
function modeNotice(){return DEMO?'<div class="notice orange"><b>Mode demo · data contoh.</b> Semua perubahan tersimpan di browser ini. Data mahasiswa asli tersedia setelah aktivasi ruang kerja live.</div>':PUBLIC?'<div class="notice">Tampilan publik. Masuk ruang kerja live untuk mendaftar kelompok, mengumpulkan tugas, dan review dosen.</div>':'';}

function stats(){const approved=projects.filter(p=>done(p)===8).length,attend=projects.reduce((v,p)=>v+(p.stages&&status(p,5)==='approved'?Number(p.stages[5].fields.actual||0):Number(p.participants||0)),0);return `<div class="stats">${[['Mahasiswa terdaftar',131,'A 48 · B 39 · C 44'],['Kelompok aktif',projects.length,DEMO?'Contoh untuk mencoba alur':'Kelompok yang sudah mendaftar'],['Peserta kegiatan',attend,'Kegiatan yang telah disetujui'],['Proyek tuntas',approved,'Seluruh 8 tahap disetujui']].map(([l,v,s])=>`<div class="stat"><span class="eyebrow muted">${l}</span><div class="value">${v}</div><div class="sub">${s}</div></div>`).join('')}</div>`;}

function dashboard(){const avg=projects.length?Math.round(projects.reduce((v,p)=>v+done(p),0)/projects.length/8*100):0,waiting=projects.flatMap(p=>pending(p).map(n=>({p,n})));return title('DISASTER TRAUMA RESILIENCE LAB','Dari kelas.<br><span style="color:var(--lime)">Jadi aksi nyata.</span>','Satu ruang untuk menyiapkan, menjalankan, dan menuntaskan proyek ketangguhan masyarakat.',`<button class="btn primary" onclick="${PUBLIC?'openLive()':role==='public'?'loginModal()':"go('workspace')"}">${role==='teacher'?'Buka ruang proyek':'Mulai / lanjutkan'}</button>`)+stats()+`<div class="cols"><div><section class="card"><div class="cardheader"><h2>Tiga kelas. Tiga konteks.</h2><span class="pill">Tulungagung & sekitar</span></div>${trackCards()}${missionCard()}</section><section class="card"><div class="cardheader"><h2>Project pulse</h2><button class="btn ghost" onclick="go('${role==='teacher'?'teacher':'impact'}')">Lihat semua</button></div>${projectTable(shown().slice(0,5))}</section></div><div><section class="card"><div class="cardheader"><h3>Progres bersama</h3><span class="pill">8 tahap</span></div><div class="ring-wrap"><div class="ring"><svg viewBox="0 0 140 140"><circle cx="70" cy="70" r="58" stroke="#343a3e"/><circle cx="70" cy="70" r="58" stroke="#c6f36a" stroke-dasharray="${avg*3.644} 364.4" stroke-linecap="round"/></svg><div class="ring-label"><b>${avg}%</b><span>rata-rata tahap</span></div></div><div><h3>${waiting.length} review</h3><p class="small muted" style="margin-top:8px">${DEMO?'Contoh antrean.':'Tahap yang menunggu dosen.'}<br>Disetujui = progres bertambah.</p></div></div></section><section class="card"><div class="cardheader"><h3>${role==='teacher'?'Butuh perhatian':'Pusat bantuan'}</h3><span class="pill orange">${role==='teacher'?waiting.length:'Learning kit'}</span></div>${role==='teacher'?(waiting.slice(0,4).map(({p,n})=>`<div class="review-item"><div class="avatar">${p.class}${p.group}</div><div class="info"><b class="small">${stages[n].name}</b><p>${p.id} · ${esc(p.region)}</p></div><button class="btn ghost" onclick="choose('${p.id}',${n})">Review</button></div>`).join('')||'<p class="muted small">Belum ada tahap menunggu review.</p>'):`<p class="small muted">Bingung memulai? Pelajari briefing, contoh kartu keluarga, dan template laporan.</p><button style="margin-top:18px" class="btn" onclick="go('resources')">Buka learning kit</button>`}</section><section class="card" style="background:#c6f36a;color:#17200d;border-color:#c6f36a"><span class="eyebrow">Bukan sekadar laporan</span><h2 style="margin:12px 0">Satu lokasi.<br>Satu kebutuhan.<br>Satu perubahan.</h2><p class="small">Tinggalkan toolkit yang bisa dipakai masyarakat setelah semester selesai.</p><button class="btn" style="margin-top:18px;background:#17200d;color:#c6f36a" onclick="go('resources')">Lihat standar karya</button></section></div></div>`;}
function projectTable(list){return list.length?`<div class="table-wrap"><table><thead><tr><th>Proyek</th><th>Progres</th><th>Status</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${esc(p.title)}</b><div class="muted">${p.id} · ${esc(p.region)}</div></td><td style="min-width:95px"><div class="small">${done(p)} / 8</div><div class="progress" style="margin-top:7px"><span style="width:${done(p)/8*100}%"></span></div></td><td>${done(p)===8?badge('approved'):badge(status(p,activeStep(p)))}</td><td>${PUBLIC||role==='public'?'<span class="muted">Ringkasan</span>':`<button class="btn ghost" onclick="choose('${p.id}')">${role==='teacher'?'Review':'Buka'}</button>`}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada kelompok. Pendaftaran kelompok adalah langkah pertama.</div>';}

function workspace(){if(PUBLIC||role==='public'||!projects.length)return title('RUANG PROYEK','Mulai langkah pertamamu.','Daftar kelompok dengan NIM anggota yang sudah terdaftar. Satu mahasiswa hanya bergabung dalam satu kelompok.')+`<div class="card">${trackCards()}<div style="margin-top:22px" class="row"><button class="btn primary" onclick="${PUBLIC?'openLive()':'loginModal(\'register\')'}">Daftar kelompok</button><button class="btn" onclick="go('resources')">Pelajari briefing</button></div></div>`;const p=project(),n=currentStep,s=p.stages[n];if(!s)return '<div class="empty">Masuk ruang kerja untuk melihat isian.</div>';const gate=n>0&&p.stages[n-1].status!=='approved',locked=role!=='student'||gate||['submitted','approved'].includes(s.status)||p.published;return title(`${p.id} / ${tracks[p.class].name}`,'Ruang proyekmu.',esc(p.title),`<div class="row">${role==='teacher'?`<select aria-label="Pilih kelompok" style="width:auto" onchange="choose(this.value)">${projects.map(x=>`<option value="${x.id}" ${x.id===p.id?'selected':''}>${x.id}</option>`).join('')}</select>`:''}<span class="pill lime">${done(p)}/8 disetujui</span></div>`)+`<div class="step-grid"><div><div class="step-list">${stages.map((st,i)=>`<button class="${i===n?'active':''} ${status(p,i)}" onclick="currentStep=${i};render()"><span class="stepno">${status(p,i)==='approved'?'✓':String(i+1).padStart(2,'0')}</span><span><strong>${st.name}</strong><small>${statusNames[status(p,i)]}</small></span></button>`).join('')}</div><div class="card" style="margin-top:20px;padding:18px"><span class="kicker">ANGGOTA KELOMPOK</span>${(p.memberDetails||[]).map(m=>`<p class="small" style="margin-top:12px">${esc(m.name)}<br><span class="muted" style="font-size:12px">${esc(m.nim)}</span></p>`).join('')}</div></div><div><section class="card"><div class="cardheader"><div><span class="kicker">MISSION ${String(n+1).padStart(2,'0')}</span><h2 style="margin-top:8px">${stages[n].name}</h2></div>${badge(s.status)}</div><p class="muted small" style="margin-bottom:20px">${stages[n].desc}</p>${gate?'<div class="notice orange">Tahap ini terbuka setelah tahap sebelumnya disetujui dosen.</div>':''}${s.feedback?`<div class="notice orange"><b>Catatan dosen</b><br>${esc(s.feedback)}</div>`:''}<form id="stage-form" onsubmit="event.preventDefault()">${n===0?`<div class="notice">Bergerak di ranah edukasi dan kesiapan nonklinis. Mahasiswa tidak mendiagnosis PTSD, tidak menggali kisah traumatik, dan tidak melakukan terapi mandiri.</div><input type="hidden" name="quiz" value="${esc(s.fields.quiz||'')}"><div class="row" style="margin-bottom:20px"><button type="button" class="btn primary" onclick="quizModal('briefing')" ${locked?'disabled':''}>Kerjakan briefing 5 pertanyaan</button><span class="pill">${s.fields.quiz||0} / 5 benar</span></div>${fieldHtml(['ethics','Saya memahami batas peran, persetujuan sukarela, dan keselamatan kegiatan','checkbox','Dosen juga memeriksa keanggotaan kelompok sebelum menyetujui.'],s.fields,locked)}`:schema[n].map(field=>fieldHtml(field,s.fields,locked)).join('')}${n===6?impactMini(s.fields):''}${role==='student'?`<div class="row"><button type="button" class="btn" onclick="saveStage(false)" ${locked?'disabled':''}>Simpan draf</button><button type="button" class="btn primary" onclick="saveStage(true)" ${locked?'disabled':''}>Ajukan ke dosen</button></div><p class="small muted" style="margin-top:12px">${s.status==='submitted'?'Isian terkunci selama review. Dosen dapat mengembalikannya untuk revisi.':s.status==='approved'?'Tahap ini sudah disetujui. Hubungi dosen untuk membuka revisi.':'Draf belum dianggap terkumpul. Klik Ajukan ke dosen saat lengkap.'}</p>`:''}</form>${role==='teacher'?reviewControls(p,n):''}</section>${contributionCard(p,n)}${p.grade?`<section class="card"><span class="kicker">PENILAIAN PROYEK</span><h2 style="margin-top:10px">${p.grade.total} / 100</h2><p class="muted small" style="margin-top:10px">${esc(p.grade.note)}</p><p class="small muted" style="margin-top:10px">Nilai proyek kelompok. Catatan kontribusi individu diperiksa terpisah oleh dosen.</p></section>`:''}</div></div>`;}
function formFields(){const form=$('#stage-form'),obj={};for(const element of form.elements){if(!element.name)continue;obj[element.name]=element.type==='checkbox'?element.checked:element.value;}return obj;}
function validate(n,f,p){const required=schema[n].filter(x=>x[2]!=='checkbox').map(x=>x[0]);if(n===0){if(Number(f.quiz)!==5||!f.ethics)throw Error('Selesaikan briefing 5/5 dan konfirmasi etik.');}for(const k of required)if(String(f[k]??'').trim()==='')throw Error('Lengkapi semua isian wajib.');if(n===2&&!f.anonymity)throw Error('Konfirmasi anonimisasi data.');for(const [k,,type]of schema[n]){if(type==='url'&&f[k]&&!/^https:\/\/[^\s]+$/.test(f[k]))throw Error('Tautan harus diawali https://.');if(type==='number'&&f[k]!==undefined&&(!Number.isInteger(Number(f[k]))||Number(f[k])<0||Number(f[k])>500))throw Error('Jumlah harus berupa angka bulat 0–500.');}if(n===6){const pairs=parsePairs(f.pairs);if(!pairs.length)throw Error('Isi pasangan skor.');if(pairs.length>Number(p.stages[5].fields.actual))throw Error('Pasangan skor melebihi peserta kegiatan.');if(Number(f.adopted)>Number(p.stages[5].fields.actual))throw Error('Tindak lanjut melebihi peserta kegiatan.');}}
async function saveStage(submit){const p=project(),n=currentStep,fields=formFields();await mutate(async()=>{if(submit)validate(n,fields,p);if(DEMO){p.stages[n]={...p.stages[n],fields,status:submit?'submitted':p.stages[n].status};if(n===1){p.title=fields.goal||p.title;p.region=fields.region||p.region;}p.version++;p.updated=new Date().toISOString();persistDemo();}else{const r=await call('save',{id:p.id,version:p.version,stage:n,fields,submit});replaceProject(r.project);}toast(submit?'Tahap diajukan. Menunggu review dosen.':'Draf tersimpan.');});}
function replaceProject(p){const i=projects.findIndex(x=>x.id===p.id);if(i<0)projects.push(p);else projects[i]=p;}
function reviewControls(p,n){return `<hr class="divider"><span class="kicker">REVIEW DOSEN</span><div class="field" style="margin-top:14px"><label>Masukan untuk kelompok</label><textarea id="review-feedback" placeholder="Tulis arahan spesifik untuk perbaikan">${esc(p.stages[n].feedback||'')}</textarea></div><div class="row"><button class="btn primary" onclick="reviewStage('approved')" ${p.stages[n].status!=='submitted'?'disabled':''}>Setujui tahap</button><button class="btn orange" onclick="reviewStage('revision')" ${!['submitted','approved'].includes(p.stages[n].status)?'disabled':''}>Kembalikan / buka revisi</button></div><p class="small muted" style="margin-top:12px">Membuka revisi tahap lama membatalkan persetujuan tahap sesudahnya, nilai, dan publikasi.</p>${n===7?`<hr class="divider"><button class="btn" onclick="gradeModal()" ${p.stages[7].status!=='approved'?'disabled':''}>Nilai dengan rubrik</button> <button class="btn primary" onclick="publish(${!p.published})" ${!p.published&&(done(p)!==8||!p.grade||!p.stages[7].fields.publishConsent)?'disabled':''}>${p.published?'Tarik dari galeri':'Publikasikan toolkit'}</button><p class="small muted" style="margin-top:12px">Publikasikan hanya setelah memeriksa isi tautan toolkit: tanpa data pribadi dan dengan izin kelompok.</p>`:''}`;}
async function reviewStage(newStatus){const p=project(),n=currentStep,feedback=$('#review-feedback').value;await mutate(async()=>{if(newStatus==='revision'&&feedback.trim().length<3)throw Error('Tuliskan arahan revisi.');if(newStatus==='approved')validate(n,p.stages[n].fields,p);if(DEMO){p.stages[n].status=newStatus;p.stages[n].feedback=feedback;if(newStatus==='revision'){p.stages.slice(n+1).forEach(s=>{s.status='draft';s.feedback='Periksa kembali setelah revisi tahap sebelumnya.';});p.grade=null;p.published=false;}p.version++;persistDemo();}else replaceProject((await call('review',{id:p.id,version:p.version,stage:n,status:newStatus,feedback})).project);toast(newStatus==='approved'?'Tahap disetujui.':'Tahap dikembalikan untuk revisi.');});}
function contributionCard(p,n){const logs=(p.logs||[]).filter(l=>l.stage===n);return `<section class="card"><div class="cardheader"><h3>Kontribusi individu</h3><span class="pill">${logs.length} catatan</span></div><p class="small muted">Catatan dibuat melalui akses kelompok. Dosen memverifikasi kontribusi; progres kelompok tidak otomatis menjadi progres individu.</p>${role==='student'?`<div style="margin-top:18px" class="field"><label>Atas nama anggota</label><select id="log-nim">${(p.memberDetails||[]).map(m=>`<option value="${esc(m.nim)}">${esc(m.name)}</option>`).join('')}</select></div><div class="field"><label>Kontribusi pada tahap ${n+1}</label><textarea id="log-note" placeholder="Apa yang Anda kerjakan? Jelaskan tindakan, hasil, dan refleksi."></textarea></div><button class="btn" onclick="saveLog()" ${p.published?'disabled':''}>Catat kontribusi</button>`:''}${logs.map(l=>`<div class="log"><b class="small">${esc(p.memberDetails?.find(m=>m.nim===l.nim)?.name||l.nim)}</b><span class="muted" style="display:block;font-size:12px">${dateText(l.time)}</span><p>${esc(l.note)}</p></div>`).join('')}${!logs.length?'<p class="muted small" style="margin-top:18px">Belum ada kontribusi tercatat di tahap ini.</p>':''}</section>`;}
async function saveLog(){const p=project(),nim=$('#log-nim').value,note=$('#log-note').value,n=currentStep;await mutate(async()=>{if(note.trim().length<10)throw Error('Jelaskan kontribusi minimal 10 karakter.');if(DEMO){p.logs.push({nim,note,stage:n,time:new Date().toISOString()});p.version++;persistDemo();}else replaceProject((await call('contribution',{id:p.id,version:p.version,nim,note,stage:n})).project);toast('Kontribusi tercatat.');});}
function dateText(t){if(!t)return '—';return new Date(t).toLocaleString('id-ID',{timeZone:'Asia/Jakarta',dateStyle:'medium',timeStyle:'short'})+' WIB';}
function filters(withSearch=true){return `<div class="filterbar"><select aria-label="Filter kelas" onchange="filter=this.value;render()"><option value="all">Semua kelas</option>${['A','B','C'].map(c=>`<option value="${c}" ${filter===c?'selected':''}>Kelas ${c}</option>`).join('')}</select>${withSearch?`<input aria-label="Cari proyek" id="search" value="${esc(query)}" placeholder="Cari judul, kelompok, kabupaten…" oninput="searchRows(this.value)">`:''}<button class="btn" onclick="refresh()">Muat ulang</button></div>`;}
function searchRows(v){query=v;const table=$('#filtered-table');if(table)table.innerHTML=projectTable(shown());}
function teacher(){if(role!=='teacher')return title('PROJECT PULSE','Misi setiap kelas.','Lihat ringkasan progres. Review dilakukan di ruang kerja dosen.')+filters()+`<div class="card" id="filtered-table">${projectTable(shown())}</div>`;return title('DOSEN / COMMAND BOARD','Pantau. Review. Dampingi.','Lihat kelompok yang membutuhkan masukan; progres bertambah setelah tahap disetujui.')+filters()+`<section class="card" id="filtered-table">${projectTable(shown())}</section><section class="card"><h3>Penilaian yang jelas sejak awal</h3><p class="muted small" style="margin-top:10px">Konteks & etika 20% · Data 20% · Toolkit 25% · Pelaksanaan 20% · Evaluasi & refleksi 15%. Nilai proyek kelompok; kontribusi individu dibaca melalui catatan per tahap.</p></section>`;}
function students(){if(role!=='teacher')return '<div class="empty">Daftar mahasiswa hanya tersedia di ruang dosen.</div>';const all=DEMO?projects.flatMap(p=>p.memberDetails):roster;const rows=all.filter(m=>filter==='all'||m.class===filter);return title('131 MAHASISWA / ANGKATAN 2024','Setiap orang punya peran.','Keanggotaan, progres kelompok, dan catatan individu ditampilkan terpisah.')+(DEMO?'<div class="notice orange">Demo menampilkan nama fiktif. Seluruh 131 nama dan NIM asli sudah disiapkan di backend privat.</div>':'')+filters(false)+`<div class="card"><div class="cardheader"><h3>${DEMO?rows.length+' contoh mahasiswa':rows.length+' mahasiswa'}</h3><button class="btn" onclick="exportStudents()">Ekspor progres CSV</button></div><div class="table-wrap"><table><thead><tr><th>Mahasiswa</th><th>Kelas / kelompok</th><th>Progres kelompok</th><th>Kontribusi individu</th><th></th></tr></thead><tbody>${rows.map(m=>{const p=projects.find(p=>(p.memberIds||[]).includes(m.nim));const logs=(p?.logs||[]).filter(l=>l.nim===m.nim);const count=new Set(logs.map(l=>l.stage)).size;return `<tr><td><b>${esc(m.name)}</b><div class="muted">${esc(m.nim)}</div></td><td>${m.class} / ${p?p.id:'Belum berkelompok'}</td><td>${p?done(p)+'/8 tahap':'—'}</td><td>${count}/8 tahap dicatat <span class="muted">(${logs.length} catatan)</span></td><td>${p?`<button class="btn ghost" onclick="choose('${p.id}')">Detail</button>`:''}</td></tr>`;}).join('')}</tbody></table></div></div>`;}
function exportStudents(){const all=DEMO?projects.flatMap(p=>p.memberDetails):roster;const rows=[['NIM','Nama','Kelas','Kelompok','Tahap kelompok disetujui','Tahap kontribusi individu','Jumlah catatan']];all.forEach(m=>{const p=projects.find(p=>(p.memberIds||[]).includes(m.nim)),logs=(p?.logs||[]).filter(l=>l.nim===m.nim);rows.push([m.nim,m.name,m.class,p?.id||'',p?done(p):0,new Set(logs.map(l=>l.stage)).size,logs.length]);});download('progres-mahasiswa-siaga.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/^[=+\-@]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');}
function resources(){return title('LEARNING KIT / START HERE','Bekal sebelum bergerak.','Pelajari batas peran, gunakan template, lalu sesuaikan dengan mitra dan sumber resmi setempat.')+`<div class="resource-grid"><article class="card"><div class="tagnum">01</div><h2>Briefing 5 menit</h2><p>Keselamatan, PFA, privasi, dan cara membaca dampak. Lima pertanyaan singkat sebelum mulai proyek.</p><button class="btn primary" onclick="quizModal('learning')">Mulai briefing</button></article><article class="card"><div class="tagnum" style="color:var(--blue)">02</div><h2>Family readiness card</h2><p>Template kartu komunikasi keluarga, dukungan kelompok rentan, dan akses informasi terpercaya.</p><button class="btn" onclick="kitModal()">Buka / cetak kartu</button></article><article class="card"><div class="tagnum" style="color:var(--orange)">03</div><h2>Data yang bermakna</h2><p>Gunakan kode anonim dan alat ukur yang sama. Pasangkan skor awal–akhir dari peserta yang sama.</p><button class="btn" onclick="download('template-pasangan-skor.csv','kode,skor_awal,skor_akhir\nR01,,\nR02,,\nR03,,','text/csv')">Unduh template CSV</button></article><article class="card"><div class="tagnum" style="color:var(--purple)">04</div><h2>Standar tugas akhir</h2><p>Laporan ringkas, toolkit, bukti kegiatan, data anonim, analisis keterbatasan, dan kontribusi setiap anggota.</p><button class="btn" onclick="finalOutline()">Unduh kerangka laporan</button></article></div><section class="card" style="margin-top:20px"><div class="cardheader"><h2>Sumber yang bisa ditelusuri</h2><span class="pill">Verifikasi lokasi & tanggal</span></div><div class="source-list"><a href="https://bpbd.tulungagung.go.id/" target="_blank" rel="noopener">BPBD Tulungagung · konteks risiko dan koordinasi lokal</a><a href="https://www.bmkg.go.id/" target="_blank" rel="noopener">BMKG · gempa, tsunami, dan cuaca</a><a href="https://magma.esdm.go.id/" target="_blank" rel="noopener">MAGMA / PVMBG · informasi gunung api</a><a href="https://www.who.int/publications-detail-redirect/9789241548205" target="_blank" rel="noopener">WHO · Psychological First Aid: Guide for Field Workers</a></div><p class="small muted" style="margin-top:18px">Kelas C memakai konteks regional Kelud / Blitar–Kediri. Jangan menganggap seluruh Tulungagung sebagai zona evakuasi gunung api. Pilih lokasi berdasarkan informasi resmi dan persetujuan dosen. Informasi megathrust adalah potensi, bukan prediksi tanggal kejadian.</p></section>`;}
let quizContext='learning';function quizModal(context){quizContext=context;openModal(`<div class="modal-head"><div><span class="kicker">QUICK BRIEFING</span><h2 style="margin-top:8px">Siap sebelum membantu.</h2></div><button class="close" onclick="closeModal()" aria-label="Tutup">×</button></div><form id="quiz-form" onsubmit="event.preventDefault();checkQuiz()">${quiz.map((q,i)=>`<div class="quiz-question"><p>${i+1}. ${q[0]}</p>${q[1].map((a,j)=>`<label class="quiz-option"><input required type="radio" name="q${i}" value="${j}">${a}</label>`).join('')}</div>`).join('')}<div class="row" style="margin-top:20px"><button class="btn primary">Periksa jawaban</button></div><div id="quiz-result"></div></form>`);}
function checkQuiz(){const form=$('#quiz-form'),data=new FormData(form);let score=0;const wrong=[];quiz.forEach((q,i)=>{if(Number(data.get('q'+i))===q[2])score++;else wrong.push(q[3]);});$('#quiz-result').innerHTML=`<div class="quiz-result"><h3>${score}/5 benar</h3><p class="small muted" style="margin-top:8px">${score===5?'Bekal awal selesai. Gunakan prinsip ini dalam semua kegiatan.':wrong.join(' ')}</p>${score===5&&quizContext==='briefing'?'<button type="button" class="btn primary" style="margin-top:16px" onclick="applyQuiz()">Gunakan hasil briefing</button>':''}</div>`;}
function applyQuiz(){const input=$('#stage-form input[name=quiz]');if(input)input.value='5';closeModal();toast('Briefing 5/5. Centang komitmen etik lalu ajukan tahap.');}
function kitModal(){openModal(`<div class="modal-head"><h2>Family readiness card</h2><button class="close" onclick="closeModal()" aria-label="Tutup">×</button></div><div class="printable"><span class="eyebrow">SATU SIAGA / KARTU KELUARGA</span><h3>Rencana komunikasi & dukungan</h3><p>Isi bersama keluarga. Simpan di rumah atau ponsel pribadi; jangan unggah isian identitas ke platform publik.</p>${['Ancaman lokal & sumber informasi resmi','Titik temu aman sesuai arahan setempat','Kontak keluarga di luar wilayah','Siapa membantu anak / lansia / anggota dengan disabilitas?','Jika terpisah, siapa dihubungi dan di mana bertemu?','Layanan lokal yang telah dikonfirmasi & tanggal verifikasi'].map(t=>`<p>${t}</p><div class="line"></div>`).join('')}<h3>Keselamatan dulu, dukungan kemudian</h3><p>Ikuti arahan petugas. Setelah aman, tawarkan bantuan praktis, dengarkan tanpa memaksa bercerita, dan hubungkan dengan keluarga atau layanan yang dibutuhkan. Jangan menjanjikan keselamatan yang belum dipastikan.</p><p>Kartu ini mendukung komunikasi keluarga; rute evakuasi dan keputusan keselamatan mengikuti panduan resmi setempat.</p></div><button class="btn primary print-hide" style="margin-top:20px" onclick="window.print()">Cetak / simpan PDF</button>`);}
function finalOutline(){download('kerangka-laporan-satu-siaga.md','# LAPORAN AKHIR SATU SIAGA\n\nKelas / Kelompok:\nJudul / Lokasi / Mitra:\n\n1. Ringkasan proyek dan kebutuhan nyata\n2. Konteks risiko: sumber resmi, tanggal, kesesuaian wilayah\n3. Tujuan kesiapsiagaan dan kelompok sasaran\n4. Izin, persetujuan sukarela, keselamatan, anonimisasi dan rujukan\n5. Metode baseline: instrumen nonklinis, skala dan jumlah peserta\n6. Toolkit: kartu keluarga, komunikasi anak, PFA dan rujukan terverifikasi\n7. Pelaksanaan: tanggal, peserta aktual, latihan aman dan bukti privat\n8. Evaluasi: peserta berpasangan, rerata awal/akhir, selisih poin skor\n9. Tindak lanjut: indikator perilaku, bukti dan tanggal pemeriksaan\n10. Keterbatasan: tanpa klaim diagnosis, pencegahan PTSD, atau kausalitas\n11. Kontribusi dan refleksi setiap mahasiswa\n12. Penyerahan toolkit kepada mitra dan rencana keberlanjutan\n13. Daftar rujukan\n\nLampiran privat: data anonim, izin mitra, bukti kegiatan\nLampiran publik: toolkit tanpa identitas dan ringkasan yang diizinkan\n','text/markdown');}
function parsePairs(raw){if(!raw)return [];const seen=new Set();const rows=raw.trim().split(/\n/);if(rows.length>200)throw Error('Maksimal 200 pasangan.');return rows.map((l,i)=>{const a=l.trim().split(/[,;\t]/);if(a.length!==3||!/^R\d{1,4}$/i.test(a[0].trim()))throw Error('Baris '+(i+1)+': gunakan R01,40,70 tanpa baris judul.');const code=a[0].trim().toUpperCase();if(seen.has(code))throw Error('Kode '+code+' berulang.');seen.add(code);const pre=Number(a[1]),post=Number(a[2]);if(!a[1].trim()||!a[2].trim()||![pre,post].every(v=>Number.isFinite(v)&&v>=0&&v<=100))throw Error('Skor harus diisi 0–100.');return {code,pre,post};});}
function pairStats(pairs){const n=pairs.length;return {n,pre:n?pairs.reduce((v,p)=>v+p.pre,0)/n:0,post:n?pairs.reduce((v,p)=>v+p.post,0)/n:0};}
function impactMini(f){try{const d=pairStats(parsePairs(f.pairs));return d.n?`<div class="notice">${d.n} pasangan · Awal ${d.pre.toFixed(1)} · Akhir ${d.post.toFixed(1)} · Selisih ${(d.post-d.pre)>=0?'+':''}${(d.post-d.pre).toFixed(1)} poin skor. Ini bukan perubahan klinis.</div>`:'';}catch{return '<div class="notice orange">Format data pasangan perlu diperiksa sebelum diajukan.</div>';}}
function impact(){const list=shown().filter(p=>PUBLIC?p.published:status(p,6)==='approved');let pairs=[];list.forEach(p=>{try{pairs=pairs.concat(PUBLIC?p.pairs||[]:parsePairs(p.stages[6].fields.pairs));}catch{}});const s=PUBLIC?list.reduce((v,p)=>{const t=p.impact||{n:0,pre:0,post:0};v.n+=t.n;v.pre+=t.n*t.pre;v.post+=t.n*t.post;return v;},{n:0,pre:0,post:0}):pairStats(pairs);if(PUBLIC&&s.n){s.pre/=s.n;s.post/=s.n;}const delta=s.post-s.pre;const adopted=list.reduce((v,p)=>v+Number(PUBLIC?p.adopted||0:p.stages[6].fields.adopted||0),0);return title('IMPACT BOARD / EVIDENCE FIRST','Lihat perubahan.<br><span style="color:var(--lime)">Baca batasnya.</span>','Perubahan skor edukasi dan tindak lanjut ditampilkan dari tahap yang telah disetujui dosen.')+filters(false)+`<div class="stats">${[['Pasangan skor',s.n,'Peserta yang sama, alat ukur sama'],['Skor awal',s.n?s.pre.toFixed(1):'—','Skala 0–100'],['Skor akhir',s.n?s.post.toFixed(1):'—','Skala 0–100'],['Tindak lanjut',adopted,'Peserta dengan tindakan terlapor']].map(([l,v,t])=>`<div class="stat"><span class="eyebrow muted">${l}</span><div class="value">${v}</div><div class="sub">${t}</div></div>`).join('')}</div><div class="cols"><section class="card"><div class="cardheader"><h2>Awal → akhir</h2><span class="pill lime">${s.n?(delta>=0?'+':'')+delta.toFixed(1)+' poin skor':'Belum ada data'}</span></div>${s.n?`<div class="bar-chart">${[['Awal',s.pre,''],['Akhir',s.post,'after']].map(([l,v,c])=>`<div class="bar-row"><span>${l}</span><div class="bar-track"><div class="bar ${c}" style="width:${v}%"></div></div><b>${v.toFixed(1)}</b></div>`).join('')}</div>`:'<div class="empty">Hasil muncul setelah tahap Ukur perubahan disetujui.</div>'}<p class="small muted" style="margin-top:24px">Gabungan ini bersifat deskriptif. Perbandingan antarkelompok hanya bermakna jika instrumen dan skala setara. Hasil tidak membuktikan bahwa proyek mencegah PTSD atau menjadi sebab tunggal perubahan.</p></section><section class="card" style="margin:0"><h3>Ukuran yang lebih dekat ke tindakan</h3><ul class="list"><li>Apakah keluarga membuat rencana komunikasi?</li><li>Apakah mitra menerima dan menggunakan toolkit?</li><li>Kapan tindak lanjut diperiksa dan apa buktinya?</li><li>Apa keterbatasan yang masih tersisa?</li></ul></section></div><section class="card"><h2>Bukti tiap proyek</h2><div class="table-wrap" style="margin-top:20px"><table><thead><tr><th>Kelompok</th><th>Pasangan</th><th>Awal / akhir</th><th>Tindak lanjut</th></tr></thead><tbody>${list.map(p=>{let a=[];try{a=PUBLIC?p.pairs||[]:parsePairs(p.stages[6].fields.pairs);}catch{}const t=PUBLIC?p.impact||{n:0,pre:0,post:0}:pairStats(a);return `<tr><td>${esc(p.title)}<div class="muted">${p.id}</div></td><td>${t.n}</td><td>${t.pre.toFixed(1)} / ${t.post.toFixed(1)}</td><td>${PUBLIC?p.adopted||0:p.stages[6].fields.adopted||0}</td></tr>`;}).join('')||'<tr><td colspan="4">Belum ada data yang disetujui.</td></tr>'}</tbody></table></div></section>`;}
function safeUrl(v){try{const u=new URL(v);return u.protocol==='https:'?esc(u.href):'#';}catch{return '#';}}
function gallery(){const list=shown().filter(p=>p.published);return title('COMMUNITY TOOLKIT / PUBLIC GALLERY','Karya yang terus dipakai.','Toolkit dan ringkasan yang disetujui dosen serta diizinkan kelompok. Identitas responden dan bukti privat tidak dipublikasikan.')+filters(false)+`<div class="gallery">${list.map(p=>`<article class="card"><div class="gallery-label"><span class="pill ${p.class==='A'?'lime':p.class==='B'?'blue':'orange'}">${tracks[p.class].name}</span><span class="eyebrow muted">${p.id}</span></div><h3>${esc(p.title)}</h3><p>${esc(PUBLIC?p.summary:p.stages[7].fields.summary)}</p><div class="small muted" style="margin-bottom:20px">${esc(p.region)} · ${DEMO?'Karya contoh':'Sudah ditinjau'}</div>${DEMO?`<button class="btn primary" onclick="kitModal()">Lihat contoh kartu</button>`:`<a class="btn primary" href="${safeUrl(PUBLIC?p.toolkit:p.stages[7].fields.publicUrl)}" target="_blank" rel="noopener">Buka toolkit</a>`}</article>`).join('')||'<div class="card empty" style="grid-column:1/-1">Belum ada karya terbit. Pengumpulan tetap berlangsung di ruang proyek.</div>'}</div>`;}
function settingsPage(){return title('DOSEN / PENGATURAN','Ritme proyek, lebih jelas.','Atur batas pengumpulan. Tenggat memakai WIB dan berlaku untuk pengajuan semua tahap.')+`<div class="card"><h3>Tenggat pengumpulan</h3><div class="field" style="margin-top:18px"><label>Tanggal dan jam (WIB)</label><input id="deadline" type="datetime-local" value="${esc(settings.deadline||'')}"><small>Biarkan kosong jika belum ditetapkan. Draf masih dapat disimpan setelah tenggat.</small></div><button class="btn primary" onclick="saveSettings()">Simpan tenggat</button></div>${DEMO?`<div class="card"><h3>Data contoh di perangkat ini</h3><p class="muted small" style="margin:12px 0 18px">Reset mengembalikan enam proyek contoh. Data mahasiswa live tidak terpengaruh.</p><button class="btn orange" onclick="resetModal()">Reset demo</button><button class="btn" onclick="download('siaga-demo-backup.json',JSON.stringify(projects,null,2),'application/json')">Ekspor demo</button></div>`:''}`;}
async function saveSettings(){const value=$('#deadline').value;await mutate(async()=>{if(DEMO){settings.deadline=value;toast('Tenggat demo tersimpan untuk sesi ini.');}else{settings=(await call('settings',{deadline:value})).settings;toast('Tenggat tersimpan.');}});}
function gradeModal(){const p=project();openModal(`<div class="modal-head"><h2>Rubrik ${p.id}</h2><button class="close" onclick="closeModal()" aria-label="Tutup">×</button></div><p class="muted small" style="margin-bottom:20px">Isi tiap aspek 0–100. Bobot diterapkan otomatis.</p>${['Konteks & etika · 20%','Kualitas data · 20%','Toolkit · 25%','Pelaksanaan · 20%','Evaluasi & refleksi · 15%'].map((t,i)=>`<div class="field"><label>${t}</label><input id="score${i}" type="number" min="0" max="100" value="${p.grade?.scores[i]??''}"></div>`).join('')}<div class="field"><label>Catatan penilaian</label><textarea id="grade-note">${esc(p.grade?.note||'')}</textarea></div><button class="btn primary" onclick="saveGrade()">Simpan nilai proyek</button>`);}
async function saveGrade(){const p=project(),raw=[0,1,2,3,4].map(i=>$('#score'+i).value),scores=raw.map(Number),note=$('#grade-note').value;await mutate(async()=>{if(raw.some(v=>v==='')||scores.some(v=>v<0||v>100||!Number.isFinite(v)))throw Error('Semua aspek harus diisi 0–100.');if(DEMO){p.grade={scores,note,total:Math.round(scores.reduce((v,s,i)=>v+s*[.2,.2,.25,.2,.15][i],0)*10)/10};p.version++;persistDemo();}else replaceProject((await call('review',{id:p.id,version:p.version,operation:'grade',scores,note})).project);closeModal();toast('Nilai proyek tersimpan.');});}
async function publish(yes){const p=project();await mutate(async()=>{if(DEMO){p.published=yes;p.version++;persistDemo();}else replaceProject((await call('review',{id:p.id,version:p.version,operation:yes?'publish':'unpublish'})).project);toast(yes?'Toolkit masuk galeri publik.':'Toolkit ditarik dari galeri.');});}
function resetModal(){openModal('<div class="modal-head"><h2>Reset data demo?</h2><button class="close" onclick="closeModal()" aria-label="Tutup">×</button></div><p class="muted small" style="margin-bottom:20px">Perubahan contoh pada perangkat ini akan dihapus. Anda bisa ekspor demo terlebih dahulu.</p><button class="btn orange" onclick="projects=demoSeed();persistDemo();closeModal();go(\'dashboard\');toast(\'Demo dikembalikan.\')">Ya, reset demo</button>');}
function openModal(html){const d=$('#modal');d.innerHTML=html;if(!d.open)d.showModal();}function closeModal(){$('#modal').close();}
function openLive(){if(CONFIG.appsScriptUrl)window.open(CONFIG.appsScriptUrl,'_blank','noopener');else toast('Ruang live belum dihubungkan.',true);}
function loginModal(tab='login'){if(PUBLIC)return openLive();openModal(`<div class="modal-head"><div><span class="kicker">${DEMO?'COBA ALUR PENDAFTARAN':'RUANG KERJA LIVE'}</span><h2 style="margin-top:8px">${tab==='register'?'Bentuk kelompokmu.':'Selamat datang kembali.'}</h2></div><button class="close" onclick="closeModal()" aria-label="Tutup">×</button></div><div class="tabs"><button class="btn ${tab==='login'?'active':''}" onclick="loginModal('login')">Masuk kelompok</button><button class="btn ${tab==='register'?'active':''}" onclick="loginModal('register')">Daftar kelompok</button><button class="btn ${tab==='teacher'?'active':''}" onclick="loginModal('teacher')">Dosen</button></div><form id="auth-form" onsubmit="event.preventDefault();authSubmit('${tab}')">${tab==='register'?`<div class="fields-grid"><div class="field"><label>Kelas</label><select name="class"><option>A</option><option>B</option><option>C</option></select></div><div class="field"><label>Nomor kelompok</label><input required name="group" type="number" min="1" max="30"></div></div><div class="field"><label>NIM anggota (satu per baris)</label><textarea required name="members" placeholder="Isi NIM anggota sesuai daftar kelas"></textarea><small>Nama otomatis cocok dengan daftar dosen. Maksimal 12 anggota; tidak ada pembagian kelompok otomatis.</small></div><div class="field"><label class="check"><input required type="checkbox" name="agree">Anggota setuju namanya dicatat di ruang privat kelompok dan dosen.</label></div>`:`${tab==='teacher'?'':`<div class="field"><label>ID kelompok</label><input required name="id" placeholder="Contoh A-01" maxlength="5"></div>`}<div class="field"><label>Kode akses ${tab==='teacher'?'dosen':'kelompok'}</label><input required type="password" name="secret" autocomplete="current-password"><small>${tab==='teacher'?'Kode dosen tersedia di tab Config pada Sheet milik dosen.':'Gunakan kode panjang yang diterima saat mendaftar. NIM bukan kode akses.'}</small></div>`}<button class="btn primary">${tab==='register'?'Daftarkan kelompok':'Masuk'}</button></form>${DEMO?'<p class="muted small" style="margin-top:18px">Ini demo. Untuk mencoba peran, gunakan tombol Demo mahasiswa / dosen di bagian atas.</p>':''}`);}
async function authSubmit(tab){const data=Object.fromEntries(new FormData($('#auth-form')));data.agree=!!$('#auth-form input[name=agree]')?.checked;data.role=tab==='teacher'?'teacher':'student';if(DEMO){toast('Untuk trial, gunakan tombol Demo mahasiswa / dosen. Pendaftaran NIM asli aktif setelah deployment.',true);return;}await mutate(async()=>{const r=await call(tab==='register'?'register':'login',data);token=r.token;sessionStorage.setItem('siaga-token',token);role=r.role;selected=r.project;projects=r.projects;roster=r.roster||[];settings=r.settings;currentStep=0;route=role==='teacher'?'dashboard':'workspace';closeModal();if(r.secret)openModal(`<div class="modal-head"><h2>${esc(r.project)} terdaftar!</h2><button class="close" onclick="closeModal()" aria-label="Tutup">×</button></div><p class="muted small">Simpan kode berikut dan bagikan hanya kepada anggota kelompok. Kode tidak ditampilkan lagi.</p><div style="margin:20px 0;padding:18px;border:1px solid var(--lime);border-radius:12px;overflow-wrap:anywhere"><b>${esc(r.secret)}</b></div><button class="btn primary" onclick="closeModal()">Kode sudah saya simpan</button>`);toast('Masuk berhasil.');});}
async function logout(){await mutate(async()=>{try{await call('logout');}finally{token='';sessionStorage.removeItem('siaga-token');role='public';projects=[];roster=[];route='dashboard';const r=await call('public');projects=r.projects;settings=r.settings;}});}
async function refresh(silent=false){if(busy)return;try{if(DEMO){if(!silent)toast('Demo terbaru dari browser ini.');return;}if(PUBLIC){const response=await fetch(CONFIG.appsScriptUrl+'?action=public',{redirect:'follow'});if(!response.ok)throw Error('Portal publik belum tersambung. Buka ruang kerja live.');const r=await response.json();projects=r.projects;settings=r.settings;}else{const r=await call(token?'load':'public');projects=r.projects;settings=r.settings;if(token){role=r.role;roster=r.roster||[];if(role==='student')selected=r.project;}}lastSync=new Date().toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta'});render();if(!silent)toast('Data diperbarui.');}catch(e){if(/Sesi|masuk kembali/.test(e.message)){token='';sessionStorage.removeItem('siaga-token');role='public';projects=[];roster=[];render();}if(!silent)toast(e.message,true);}}
function download(name,content,mime){const u=URL.createObjectURL(new Blob([content],{type:mime+';charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
async function init(){if(DEMO){try{const saved=JSON.parse(localStorage.getItem('siaga-demo-v1')||'null');projects=Array.isArray(saved)?saved:demoSeed();}catch{projects=demoSeed();}render();}else{$('#view').innerHTML='<div class="loading">Menyiapkan ruang SIAGA…</div>';await refresh();if(!projects.length)render();}if(GAS||PUBLIC)setInterval(()=>{if(document.visibilityState==='visible'&&!busy&&!$('#modal').open&&!['workspace','settings'].includes(route))refresh(true);},30000);}
init();
</script></body></html>
